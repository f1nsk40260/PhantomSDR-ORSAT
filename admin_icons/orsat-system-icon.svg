<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -110 220 220" width="512" height="512">
  <title>ORSAT-SYSTEM</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#0f2a14"/><stop offset="1" stop-color="#040c05"/></radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9dffb4"/><stop offset="0.55" stop-color="#00ff41"/><stop offset="1" stop-color="#00a82a"/></linearGradient>
  </defs>
  <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#bg)"/>
  <!-- outils qui dépassent : clé plate à gauche, tournevis à droite -->
  <g fill="none" stroke="#9dffb4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-58 -36 L-69 -75" stroke-width="9"/>
    <path d="M-66.1 -95.8 A12 12 0 1 1 -79.9 -95.8" stroke-width="8"/>
    <path d="M60 -36 L66 -62" stroke-width="7"/>
    <path d="M64 -60 L72 -92" stroke-width="13"/>
  </g>
  <!-- caisse : couvercle à pans coupés, poignée en barre, fermoir -->
  <path d="M-84 -14 L-70 -34 L70 -34 L84 -14 Z" fill="none" stroke="url(#green)" stroke-width="10" stroke-linejoin="round"/>
  <rect x="-84" y="-14" width="168" height="76" rx="8" fill="none" stroke="url(#green)" stroke-width="11"/>
  <path d="M-40 -34 L-40 -54 L40 -54 L40 -34" fill="none" stroke="url(#green)" stroke-width="10" stroke-linejoin="round"/>
  <rect x="-12" y="-20" width="24" height="14" rx="3" fill="#00ff41"/>
  <!-- tracé de signal commun aux logos ORSAT -->
  <path d="M-64 28 L-40 28 L-30 12 L-18 46 L-6 20 L4 28 L64 28" fill="none" stroke="#9dffb4" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
